name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test

  # R3.1 signed iOS archive for TestFlight (R4.5/R5). Manual signing from
  # secrets — no match repo, no secrets in source. Required repo config:
  #   secrets: IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD,
  #            IOS_PROVISION_PROFILE, IOS_EXPORT_OPTIONS_PLIST
  #            (all base64-encoded files)
  #   vars:    API_BASE_URL (e.g. https://api.uptrack.app)
  release-ios:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          architecture: x64
      - run: flutter pub get
      - name: Require API base URL
        run: test -n "${{ vars.API_BASE_URL }}" || (echo "Set the API_BASE_URL repo variable first" && exit 1)
      - name: Install signing assets from secrets
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
          IOS_EXPORT_OPTIONS_PLIST: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST }}
        run: |
          for v in IOS_DIST_CERT_P12 IOS_PROVISION_PROFILE IOS_EXPORT_OPTIONS_PLIST; do
            test -n "${!v}" || (echo "Missing $v secret" && exit 1)
          done
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$IOS_DIST_CERT_P12" | base64 -d > "$RUNNER_TEMP/signing/dist.p12"
          echo "$IOS_PROVISION_PROFILE" | base64 -d > "$RUNNER_TEMP/signing/profile.mobileprovision"
          echo "$IOS_EXPORT_OPTIONS_PLIST" | base64 -d > "$RUNNER_TEMP/signing/ExportOptions.plist"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
      - uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      - run: flutter build ipa --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} --export-options-plist="$RUNNER_TEMP/signing/ExportOptions.plist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa

  # R3.1 signed Android App Bundle for the Play closed track (R4.4).
  # Required repo configuration (all in Settings, never in the repo):
  #   secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  #            ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
  #   vars:    API_BASE_URL (e.g. https://api.uptrack.app)
  release-android:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
      - run: flutter pub get
      - name: Require API base URL
        run: test -n "${{ vars.API_BASE_URL }}" || (echo "Set the API_BASE_URL repo variable first" && exit 1)
      - name: Write signing files from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload.keystore
          EOF
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
